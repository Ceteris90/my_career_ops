name: 'PR adoption ladder (labels)'

# The adoption ladder (CONTRIBUTING.md -> "Adopting an abandoned PR") is run by
# maintainers: the check-ins and the close are posted under a maintainer's own
# name, one PR at a time, and the project's bot keeps to its single
# acknowledgment. This workflow only keeps the ladder labels honest: when the
# author of a PR on the ladder comments, reviews or pushes after the last
# ladder step, it removes every adoption/* label so the ladder starts over.
# It never comments, never closes a PR and never adds a label.

on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const LADDER = ['adoption/track', 'adoption/pinged', 'adoption/warned', 'adoption/ready'];

            // Every open PR carrying any ladder label (the labels filter is an AND, so one query per label).
            const onLadder = new Map();
            for (const name of LADDER) {
              const items = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', labels: name, per_page: 100,
              });
              for (const i of items) if (i.pull_request) onLadder.set(i.number, i);
            }

            for (const [n, issue] of onLadder) {
              const author = issue.user.login;
              const labels = issue.labels.map(l => l.name).filter(l => l.startsWith('adoption/'));

              // Anchor = the most recent adoption/* label event: author activity only counts after the last step.
              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner, repo, issue_number: n, per_page: 100,
              });
              const labelEvents = timeline.filter(e =>
                e.event === 'labeled' && e.label && e.label.name.startsWith('adoption/'));
              if (labelEvents.length === 0) continue;
              const anchor = new Date(labelEvents[labelEvents.length - 1].created_at);

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: n, since: anchor.toISOString(), per_page: 100,
              });
              const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner, repo, pull_number: n, since: anchor.toISOString(), per_page: 100,
              });
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner, repo, pull_number: n, per_page: 100,
              });
              const lastCommitAt = commits.length
                ? new Date(commits[commits.length - 1].commit.committer.date) : null;
              const active = comments.some(c => c.user.login === author)
                || reviewComments.some(c => c.user.login === author)
                || (lastCommitAt && lastCommitAt > anchor);
              if (!active) continue;

              for (const name of labels) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name }).catch(() => {});
              }
              core.info(`#${n}: author active again, ladder reset`);
            }
