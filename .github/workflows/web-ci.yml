name: Web CI

# CI for the experimental web UI (web/). Informative by design: it is NOT a
# required check for the core — a red here never blocks a core merge, and core
# changes never trigger it. The web/ tree versions and releases as its own
# release-please component.
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package.json
            web/package-lock.json
      # Web/core parity tests import scan.mjs and real providers. Node resolves
      # their packages from the core checkout, not from web/node_modules.
      # No browser install or other lifecycle script is needed for these tests.
      - name: Install core dependencies for parity tests
        run: npm install --ignore-scripts --no-package-lock
        working-directory: .
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
